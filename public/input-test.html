<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Input Test</title>
<style>
  :root { --bg: #f5f5f0; --card: #f0f0e8; --text: #2d2d2d; --muted: #666; --line: #e0e0d8; --accent: #d4e0e8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Inter, -apple-system, sans-serif; }
  body { display: flex; flex-direction: column; padding: max(16px, env(safe-area-inset-top)) 16px 16px; }
  h1 { font-family: 'Shippori Mincho', serif; font-weight: 600; font-size: 1.3rem; margin: 0 0 0.8rem; }
  nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 0.9rem; }
  nav a { padding: 6px 12px; border-radius: 100px; background: var(--card); color: var(--muted); font-size: 0.85rem; text-decoration: none; }
  nav a.on { background: var(--accent); color: var(--text); font-weight: 600; }
  .what { font-size: 0.8rem; color: var(--muted); line-height: 1.5; margin: 0 0 0.6rem; }
  .readout { font: 0.75rem ui-monospace, Menlo, monospace; color: var(--muted); line-height: 1.6; background: var(--card); border-radius: 12px; padding: 8px 10px; }
  .log { flex: 1; overflow-y: auto; margin: 0.8rem 0; display: flex; flex-direction: column; gap: 0.6rem; }
  .log > :first-child { margin-top: auto; }
  .msg { align-self: flex-end; background: var(--card); border-radius: 16px; padding: 8px 14px; font-family: serif; font-size: 1.05rem; }
  .row { display: flex; align-items: flex-end; gap: 0.8rem; border-bottom: 1px solid var(--line); padding: 0.5rem 0 0.6rem; }
  .field { flex: 1; min-width: 0; border: none; outline: none; background: transparent; font: 1.1rem/1.5 serif; color: var(--text); padding: 0; resize: none; max-height: 7.5rem; overflow-y: auto; }
  .field[contenteditable]:empty::before { content: attr(data-placeholder); color: var(--muted); opacity: 0.7; pointer-events: none; }
  button.send { background: none; border: none; font-size: 1.3rem; color: var(--muted); padding: 0.1rem 0.2rem; }
</style>
</head>
<body>
  <h1>Input test</h1>
  <nav id="nav"></nav>
  <p class="what" id="what"></p>
  <div class="readout" id="readout"></div>
  <div class="log" id="log"></div>
  <div class="row" id="row"></div>

<script>
  // Throwaway page: which input type, if any, gets the keyboard without iOS's
  // form bar (↑ ↓ ✓)? One field per page, picked by ?v=, since the bar's arrows
  // exist to hop between fields. Remove once the tutor input is settled.
  const VARIANTS = {
    a: { label: 'A textarea', what: 'What ハルカ uses now: a <textarea>.' },
    b: { label: 'B input', what: 'A single-line <input type="text">.' },
    c: { label: 'C editable', what: 'A <div contenteditable>: an editable area, not a form field.' },
    d: { label: 'D plain', what: 'A <div contenteditable="plaintext-only">: same, but strips pasted formatting.' },
  };
  const v = VARIANTS[new URLSearchParams(location.search).get('v')] ? new URLSearchParams(location.search).get('v') : 'a';

  document.getElementById('nav').innerHTML = Object.entries(VARIANTS)
    .map(([k, x]) => `<a href="?v=${k}" class="${k === v ? 'on' : ''}">${x.label}</a>`).join('');
  document.getElementById('what').textContent = VARIANTS[v].what + ' Tap it, type some Japanese, press return to send.';

  const row = document.getElementById('row');
  let field;
  if (v === 'a') { field = document.createElement('textarea'); field.rows = 1; field.placeholder = 'ハルカに話しかける…'; }
  else if (v === 'b') { field = document.createElement('input'); field.type = 'text'; field.placeholder = 'ハルカに話しかける…'; }
  else { field = document.createElement('div'); field.contentEditable = v === 'd' ? 'plaintext-only' : 'true'; field.dataset.placeholder = 'ハルカに話しかける…'; field.setAttribute('role', 'textbox'); }
  field.className = 'field';
  field.setAttribute('enterkeyhint', 'send');
  field.setAttribute('autocomplete', 'off');
  row.appendChild(field);
  const btn = document.createElement('button');
  btn.className = 'send'; btn.textContent = '↑'; btn.setAttribute('aria-label', 'Send');
  row.appendChild(btn);

  const isEditable = v === 'c' || v === 'd';
  const read = () => (isEditable ? field.innerText : field.value).trim();
  const clear = () => { if (isEditable) field.textContent = ''; else field.value = ''; };
  const log = document.getElementById('log');
  const send = () => {
    const text = read();
    if (!text) return;
    const m = document.createElement('div'); m.className = 'msg'; m.textContent = text;
    log.appendChild(m); log.scrollTop = log.scrollHeight;
    clear();
    field.focus();
  };
  btn.addEventListener('mousedown', (e) => e.preventDefault()); // keep the keyboard up
  btn.addEventListener('click', send);
  field.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });
  if (v === 'a') field.addEventListener('input', () => { field.style.height = 'auto'; field.style.height = field.scrollHeight + 'px'; });

  // The readout: with the keyboard up, the gap between the visible height and
  // the keyboard's own height shows whether the bar is there (it is about 44-56px).
  const out = document.getElementById('readout');
  let lowest = Infinity;
  const show = () => {
    const vv = window.visualViewport;
    const h = Math.round(vv ? vv.height : innerHeight);
    if (document.activeElement === field) lowest = Math.min(lowest, h);
    out.innerHTML = `visible height ${h}px · page height ${innerHeight}px · screen ${screen.height}px<br>` +
      `focused: ${document.activeElement === field ? 'yes' : 'no'} · lowest visible while typing: ${lowest === Infinity ? '–' : lowest + 'px'}`;
  };
  ['resize', 'scroll'].forEach((ev) => window.visualViewport?.addEventListener(ev, show));
  field.addEventListener('focus', show); field.addEventListener('blur', show);
  show();
</script>
</body>
</html>
